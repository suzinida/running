<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>러닝 기록 시스템</title>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      background: #f5f5f5; 
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .container { 
      max-width: 100%;
      max-height: 100vh;
      margin: 0 auto; 
      background: white; 
      padding: 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    h1 { 
      color: #4285F4; 
      text-align: center; 
      margin-bottom: 12px; 
      font-size: 24px;
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .session-info {
      background: #f0f7ff;
      border: 2px solid #4285F4;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #4285F4;
    }
    .session-info strong {
      font-size: 12px;
    }
    .mode-badge {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #2e7d32;
      font-weight: bold;
    }
    .mode-badge.max-distance {
      background: #fff3e0;
      border-color: #ff9800;
      color: #e65100;
    }
    .network-status {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 5px;
      display: inline-block;
    }
    .network-status.online {
      background: #d4edda;
      color: #155724;
    }
    .network-status.offline {
      background: #f8d7da;
      color: #721c24;
    }
    button.new-session-header {
      background: #ff9800;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 11px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }
    button.new-session-header:hover {
      background: #e68900;
    }
    .camera-section {
      position: relative;
      margin-bottom: 15px;
      background: #000;
      border: 2px solid #4285F4;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      width: 100%;
    }
    #video { 
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
      object-fit: cover;
      -webkit-transform: translate3d(0, 0, 0);
    }
    #canvas { display: none; }
    .camera-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    select {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      background: white;
      color: #333;
    }
    button { 
      background: #4285F4; 
      color: white;
      border: none; 
      padding: 8px 16px; 
      font-size: 13px; 
      border-radius: 5px; 
      cursor: pointer; 
      transition: background 0.3s;
      flex: 1;
      -webkit-user-select: none;
      user-select: none;
    }
    button:hover { background: #357ae8; }
    button:active { background: #2e5cc8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    /* 통계 카드 (메인) */
    .stats {
      background: linear-gradient(135deg, #f0f7ff 0%, #e3f2fd 100%);
      border: 3px solid #4285F4;
      padding: 20px;
      border-radius: 12px;
      margin: 12px 0;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .stats.running-start {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border-color: #28a745;
    }
    .stats.running-end {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
      border-color: #ffc107;
    }
    .stats.duplicate {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      border-color: #f44336;
    }
    .stats-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .stats-title {
      font-size: 20px;
      font-weight: bold;
      color: #4285F4;
      margin-bottom: 12px;
    }
    .stats-title.running-start {
      color: #28a745;
    }
    .stats-title.running-end {
      color: #ff9800;
    }
    .stats-title.duplicate {
      color: #f44336;
    }
    .stats-info {
      font-size: 14px;
      color: #333;
      line-height: 1.8;
    }
    .stats-info strong {
      color: #34A853;
      font-size: 16px;
    }

    .section {
      background: #f9f9f9;
      border: 0.5px solid #e0e0e0;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .section h3 {
      color: #4285F4;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .offline-data-count {
      background: #fff3e0;
      border: 1px solid #ff9800;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #e65100;
    }
    .offline-data-count strong {
      font-size: 16px;
      color: #ff9800;
    }
    button.upload {
      background: #4caf50;
      width: 100%;
      margin-bottom: 8px;
      font-weight: bold;
    }
    button.upload:hover {
      background: #388e3c;
    }
    button.delete {
      background: #f44336;
      width: 100%;
      font-weight: bold;
    }
    button.delete:hover {
      background: #da190b;
    }
    button.batch-end {
      background: #f44336;
      width: 100%;
      margin-top: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    button.batch-end:hover {
      background: #da190b;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease-out;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 3px solid #4285F4;
      padding-bottom: 12px;
    }
    .modal-header h2 {
      color: #4285F4;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }
    .mode-btn {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      font-size: 12px;
    }
    .mode-btn:active {
      border-color: #4285F4;
      background: #f0f7ff;
    }
    .mode-btn.selected {
      border-color: #4285F4;
      background: #f0f7ff;
    }
    .mode-btn .emoji {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .input-group {
      margin: 12px 0;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #4285F4;
    }
    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 10px;
    }
    .modal-buttons button.cancel {
      background: #999;
    }
    .modal-buttons button.cancel:hover {
      background: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏃 러닝 기록</h1>
  
  <div class="session-header">
    <div class="session-info">
      <strong>세션: <span id="sessionDisplay">준비중</span></strong>
    </div>
    <div class="mode-badge" id="modeBadge">준비중</div>
    <div class="network-status online" id="networkStatus">🟢 온라인</div>
    <button class="new-session-header" onclick="startNewSession()">🔄 새 시작</button>
  </div>
  
  <div class="camera-section">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  
  <div class="camera-controls">
    <select id="cameraSelect">
      <option value="environment">후면 카메라</option>
      <option value="user">전면 카메라</option>
    </select>
  </div>
  
  <div class="button-group">
    <button id="startBtn" onclick="startCamera()">시작</button>
    <button id="stopBtn" onclick="stopCamera()" disabled>중지</button>
  </div>

  <!-- 통계 카드 (메인) -->
  <div id="stats" class="stats" style="display:none;">
    <div class="stats-icon" id="statsIcon">📍</div>
    <div class="stats-title" id="statsTitle">기다중...</div>
    <div class="stats-info" id="statsInfo"></div>
  </div>
  
  <div class="section">
    <h3>오프라인 데이터 관리</h3>
    <div class="offline-data-count">저장됨: <strong id="offlineCount">0</strong>개</div>
    <button class="upload" onclick="uploadData()">📤 데이터 업로드</button>
    <button class="delete" onclick="clearData()">🗑️ 로컬 데이터 전부 삭제</button>
  </div>

  <div class="section">
    <button class="batch-end" id="batchEndBtn" onclick="batchEndSession()" style="display:none;">🛑 일괄 종료</button>
  </div>
</div>

<!-- 모드 선택 모달 -->
<div id="modeModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>운동 모드</h2>
      <p style="font-size: 12px;">모드를 선택하세요</p>
    </div>
    
    <div class="mode-buttons">
      <div class="mode-btn" id="maxDistanceBtn" onclick="selectMode('maxDistance')">
        <div class="emoji">📏</div>
        <strong>최대거리</strong>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">목표 거리<br>자동 종료</p>
      </div>
      <div class="mode-btn" id="freeBtn" onclick="selectMode('free')">
        <div class="emoji">🆓</div>
        <strong>자율</strong>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">거리 제한<br>없음</p>
      </div>
    </div>
    
    <div id="distanceInputGroup" class="input-group" style="display:none;">
      <label for="maxDistanceInput">목표 거리 (km):</label>
      <input type="number" id="maxDistanceInput" placeholder="예: 10" min="1" step="0.5">
    </div>
    
    <div class="modal-buttons">
      <button onclick="cancelModeSelect()" class="cancel">취소</button>
      <button id="confirmModeBtn" onclick="confirmMode()" disabled>확인</button>
    </div>
  </div>
</div>

<script>
  let video = document.getElementById('video');
  let canvas = document.getElementById('canvas');
  let canvasContext = canvas.getContext('2d');
  let scanning = false;
  let cameraStarted = false;
  let frameCount = 0;
  let lastQRData = null;
  let qrCooldown = false;
  let scanLoopInterval = null;
  
  // 세션 설정
  let currentSessionId = null;
  let sessionMode = null;
  let maxDistance = null;
  let endedStudents = {};
  
  // 네트워크
  let isOnline = navigator.onLine;

  // ================================================
  // 네트워크 상태
  // ================================================
  window.addEventListener('online', () => {
    isOnline = true;
    updateNetworkStatus();
  });

  window.addEventListener('offline', () => {
    isOnline = false;
    updateNetworkStatus();
  });

  function updateNetworkStatus() {
    const status = document.getElementById('networkStatus');
    if (isOnline) {
      status.className = 'network-status online';
      status.textContent = '🟢 온라인';
    } else {
      status.className = 'network-status offline';
      status.textContent = '⚠️ 오프라인';
    }
  }

  // ================================================
  // 통신 (재시도 로직)
  // ================================================
  async function fetchWithRetry(url, retries = 3) {
    for (let i = 0; i < retries; i++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        
        const response = await fetch(url, {
          method: 'GET',
          signal: controller.signal,
          headers: {
            'Accept': 'application/json'
          }
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        return data;
        
      } catch (error) {
        if (i === retries - 1) {
          throw error;
        }
        await new Promise(resolve => setTimeout(resolve, (i + 1) * 1000));
      }
    }
  }

  // ================================================
  // 페이스 계산 (분/km)
  // ================================================
  function calculatePace(totalSeconds, distance) {
    if (distance === 0) return null;
    
    // 분/km = 총시간(초) / 거리(km) / 60
    const paceMinutes = (totalSeconds / distance) / 60;
    const paceMin = Math.floor(paceMinutes);
    const paceSec = Math.round((paceMinutes - paceMin) * 60);
    
    return `${paceMin}'${String(paceSec).padStart(2, '0')}"/km`;
  }

  // ================================================
  // 총시간 계산 (문자열 → 초)
  // ================================================
  function timeStringToSeconds(timeStr) {
    const parts = timeStr.split(':');
    const mins = parseInt(parts[0]) || 0;
    const secs = parseInt(parts[1]) || 0;
    return mins * 60 + secs;
  }

  // ================================================
  // 로컬 데이터 관리
  // ================================================
  function saveLocalStats(qrText, scanCount, distance, totalTime, studentName, firstScanTime, lastScanTime) {
    const key = `localStats_${qrText}`;
    
    localStorage.setItem(key, JSON.stringify({
      qrText: qrText,
      scanCount: scanCount,
      distance: distance,
      totalTime: totalTime,
      studentName: studentName,
      firstScanTime: firstScanTime,
      lastScanTime: lastScanTime,
      sessionId: currentSessionId,
      lastProcessTime: Date.now()
    }));
  }

  function getLocalStats(qrText) {
    const key = `localStats_${qrText}`;
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : null;
  }

  function getAllLocalStats() {
    const stats = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('localStats_')) {
        const data = JSON.parse(localStorage.getItem(key));
        stats.push(data);
      }
    }
    return stats;
  }

  function updateOfflineCount() {
    const stats = getAllLocalStats();
    document.getElementById('offlineCount').textContent = stats.length;
  }

  // ================================================
  // 30초 중복 체크
  // ================================================
  function isDuplicateWithin30Seconds(qrText) {
    const localData = getLocalStats(qrText);
    if (!localData) {
      return false;
    }

    const now = Date.now();
    const lastTime = localData.lastProcessTime || 0;
    const diff = (now - lastTime) / 1000;

    return diff < 30;
  }

  // ================================================
  // 통계 표시 (메인)
  // ================================================
  function displayStats(studentData, scanCount, distance, totalTime, isEnded = false) {
    const statsDiv = document.getElementById('stats');
    const icon = document.getElementById('statsIcon');
    const title = document.getElementById('statsTitle');
    const info = document.getElementById('statsInfo');

    statsDiv.style.display = 'flex';
    statsDiv.classList.remove('running-start', 'running-end', 'duplicate');

    if (scanCount === 1) {
      // 첫 번째 스캔
      icon.textContent = '🏃';
      title.textContent = '러닝 시작!';
      title.classList.add('running-start');
      statsDiv.classList.add('running-start');
      info.innerHTML = '';
    } else if (isEnded) {
      // 거리제한 도달 (마지막)
      icon.textContent = '🏁';
      title.textContent = '러닝 종료!';
      title.classList.add('running-end');
      statsDiv.classList.add('running-end');
      
      // 페이스 계산
      const totalSeconds = timeStringToSeconds(totalTime);
      const pace = calculatePace(totalSeconds, distance);
      
      info.innerHTML = `
        <div style="font-size: 13px;">
          <div style="margin-bottom: 8px;"><strong>${studentData.name}</strong></div>
          <div>⏱️ ${totalTime}</div>
          <div>거리: ${distance.toFixed(1)}km</div>
          ${pace ? `<div>페이스: ${pace}</div>` : ''}
        </div>
      `;
    } else {
      // 두 번째 이상
      icon.textContent = '📍';
      title.textContent = `${String(studentData.studentNum).padStart(3, '0')}번 학생`;
      title.classList.remove('running-start', 'running-end');
      statsDiv.classList.remove('running-start', 'running-end');
      
      // 페이스 계산
      const totalSeconds = timeStringToSeconds(totalTime);
      const pace = calculatePace(totalSeconds, distance);
      
      info.innerHTML = `
        <div>
          <div>⏱️ ${totalTime}</div>
          <div>거리: <strong>${distance.toFixed(1)}km</strong></div>
          <div>라운드: <strong>${scanCount}</strong></div>
          ${pace ? `<div>페이스: ${pace}</div>` : ''}
        </div>
      `;
    }
  }

  function displayDuplicate(qrText) {
    const statsDiv = document.getElementById('stats');
    const icon = document.getElementById('statsIcon');
    const title = document.getElementById('statsTitle');
    const info = document.getElementById('statsInfo');

    statsDiv.style.display = 'flex';
    statsDiv.classList.remove('running-start', 'running-end');
    statsDiv.classList.add('duplicate');

    icon.textContent = '⚠️';
    title.textContent = '이미 처리된 QR코드';
    title.classList.add('duplicate');
    info.innerHTML = '<div style="font-size: 13px; color: #d32f2f;">30초 이내에 중복 스캔되었습니다</div>';
  }

  // ================================================
  // 초기화
  // ================================================
  function init() {
    updateNetworkStatus();
    updateOfflineCount();
    
    currentSessionId = localStorage.getItem('currentSessionId');
    sessionMode = localStorage.getItem('sessionMode');
    maxDistance = localStorage.getItem('maxDistance');
    
    if (!currentSessionId || !sessionMode) {
      showModeModal();
    } else {
      displaySessionInfo();
      updateModeBadge();
    }
  }

  // ================================================
  // 모드 선택
  // ================================================
  let selectedMode = null;

  function showModeModal() {
    document.getElementById('modeModal').classList.add('show');
  }

  function selectMode(mode) {
    selectedMode = mode;
    
    document.getElementById('maxDistanceBtn').classList.remove('selected');
    document.getElementById('freeBtn').classList.remove('selected');
    
    if (mode === 'maxDistance') {
      document.getElementById('maxDistanceBtn').classList.add('selected');
      document.getElementById('distanceInputGroup').style.display = 'block';
    } else {
      document.getElementById('freeBtn').classList.add('selected');
      document.getElementById('distanceInputGroup').style.display = 'none';
    }
    document.getElementById('confirmModeBtn').disabled = false;
  }

  function confirmMode() {
    if (!selectedMode) {
      alert('모드를 선택하세요');
      return;
    }
    
    if (selectedMode === 'maxDistance') {
      const distance = parseFloat(document.getElementById('maxDistanceInput').value);
      if (!distance || distance <= 0) {
        alert('거리를 입력하세요');
        return;
      }
      maxDistance = distance;
      localStorage.setItem('maxDistance', maxDistance);
    }
    
    generateNewSessionId();
    sessionMode = selectedMode;
    localStorage.setItem('sessionMode', sessionMode);
    
    document.getElementById('modeModal').classList.remove('show');
    displaySessionInfo();
    updateModeBadge();
  }

  function cancelModeSelect() {
    if (confirm('취소하시겠습니까?')) {
      document.getElementById('modeModal').classList.remove('show');
    }
  }

  function generateNewSessionId() {
    currentSessionId = 'SESSION_' + Date.now();
    localStorage.setItem('currentSessionId', currentSessionId);
    endedStudents = {};
  }

  function displaySessionInfo() {
    const dateObj = new Date(parseInt(currentSessionId.split('_')[1]));
    const timeStr = dateObj.toLocaleTimeString('ko-KR', {
      hour: '2-digit',
      minute: '2-digit'
    });
    document.getElementById('sessionDisplay').textContent = timeStr;
  }

  function updateModeBadge() {
    const badge = document.getElementById('modeBadge');
    if (sessionMode === 'maxDistance') {
      badge.className = 'mode-badge max-distance';
      badge.textContent = `📏 ${maxDistance}km`;
      document.getElementById('batchEndBtn').style.display = 'none';
    } else {
      badge.className = 'mode-badge';
      badge.textContent = '🆓 자율';
      document.getElementById('batchEndBtn').style.display = 'block';
    }
  }

  function startNewSession() {
    if (cameraStarted) {
      alert('카메라 중지 후 진행');
      return;
    }
    
    if (confirm('새로 시작?')) {
      localStorage.clear();
      location.reload();
    }
  }

  // ================================================
  // 카메라
  // ================================================
  async function startCamera() {
    if (cameraStarted || !sessionMode) return;
    
    cameraStarted = true;
    
    try {
      const facingMode = document.getElementById('cameraSelect').value;
      const constraints = {
        video: { 
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };
      
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.style.display = 'block';
      
      await video.play();
      
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('cameraSelect').disabled = true;
      scanning = true;
      
      startScanLoop();
      
    } catch (error) {
      alert('카메라 오류');
      cameraStarted = false;
      document.getElementById('startBtn').disabled = false;
    }
  }

  function stopCamera() {
    const stream = video.srcObject;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    video.style.display = 'none';
    scanning = false;
    cameraStarted = false;
    
    if (scanLoopInterval) {
      clearInterval(scanLoopInterval);
      scanLoopInterval = null;
    }
    
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('cameraSelect').disabled = false;
  }

  // ================================================
  // 스캔 루프
  // ================================================
  function startScanLoop() {
    if (scanLoopInterval) clearInterval(scanLoopInterval);
    
    scanLoopInterval = setInterval(() => {
      if (!scanning) return;
      
      try {
        frameCount++;
        
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          
          if (canvas.width === 0 || canvas.height === 0) return;
          
          canvasContext.drawImage(video, 0, 0);
          const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
          
          if (typeof jsQR === 'function') {
            const code = jsQR(imageData.data, canvas.width, canvas.height);
            
            if (code && !qrCooldown) {
              if (lastQRData === code.data) {
                return;
              }
              
              lastQRData = code.data;
              qrCooldown = true;
              
              handleQRData(code.data);
            }
          }
        }
      } catch (e) {
        console.error('스캔 오류:', e);
      }
    }, 50);
  }

  // ================================================
  // QR 처리
  // ================================================
  async function handleQRData(qrText) {
    scanning = false;
    
    // 이미 종료된 학생
    if (endedStudents[qrText]) {
      alert('이미 종료된 학생입니다');
      resumeScanning();
      return;
    }

    // 30초 중복 체크
    if (isDuplicateWithin30Seconds(qrText)) {
      displayDuplicate(qrText);
      resumeScanning();
      return;
    }

    // 온라인 시도
    if (isOnline) {
      try {
        const appScriptUrl = 'https://script.google.com/macros/s/AKfycbxC92EzuvA5WamPJ1yNwgFleCLgjSgoKdpUm3e-rkBjFawWqseG9hXZ0I7ePQwOa1sP/exec?qr=' + encodeURIComponent(qrText) + '&sessionId=' + encodeURIComponent(currentSessionId);
        
        const result = await fetchWithRetry(appScriptUrl, 3);
        
        if (result.success) {
          const scanCount = result.data.accumulated.scanCount;
          const distance = result.data.accumulated.distance || 0;
          const totalTime = result.data.accumulated.timeFormatted || "00:00:00";
          const studentData = result.data.student;
          
          // 로컬에도 저장
          const firstScanTime = result.data.accumulated.firstScanTime || new Date().toLocaleString('ko-KR');
          const lastScanTime = new Date().toLocaleString('ko-KR');
          saveLocalStats(qrText, scanCount, distance, totalTime, studentData.name, firstScanTime, lastScanTime);
          updateOfflineCount();
          
          // 통계 표시
          const isEnded = sessionMode === 'maxDistance' && distance >= maxDistance;
          displayStats(studentData, scanCount, distance, totalTime, isEnded);
          
          if (isEnded) {
            endedStudents[qrText] = true;
          }
          
          resumeScanning();
          return;
        }
      } catch (error) {
        // catch 블록에서 오프라인 로직으로 진행
      }
    }

    // 오프라인 처리
    const localData = getLocalStats(qrText);
    const parts = qrText.split('-');
    
    if (!parts || parts.length !== 2) {
      alert('QR 형식 오류');
      resumeScanning();
      return;
    }

    const classNum = parseInt(parts[0]);
    const studentNum = parseInt(parts[1]);
    const studentName = localData ? localData.studentName : `${classNum}반 ${studentNum}번`;

    let scanCount, distance, totalTime, firstScanTime;

    if (localData) {
      // 기존 로컬 데이터 누적
      scanCount = localData.scanCount + 1;
      distance = localData.distance + 0.2;
      firstScanTime = localData.firstScanTime;
      
      // 시간 계산
      const first = new Date(firstScanTime);
      const now = new Date();
      const diffSec = Math.round((now - first) / 1000);
      const mins = Math.floor(diffSec / 60);
      const secs = diffSec % 60;
      totalTime = mins + ':' + String(secs).padStart(2, '0');
    } else {
      // 새로운 학생
      scanCount = 1;
      distance = 0.2;
      firstScanTime = new Date().toLocaleString('ko-KR');
      totalTime = '00:00:00';
    }

    const lastScanTime = new Date().toLocaleString('ko-KR');
    saveLocalStats(qrText, scanCount, distance, totalTime, studentName, firstScanTime, lastScanTime);
    updateOfflineCount();

    // 통계 표시
    const studentData = { name: studentName, studentNum: studentNum };
    const isEnded = sessionMode === 'maxDistance' && distance >= maxDistance;
    displayStats(studentData, scanCount, distance, totalTime, isEnded);

    if (isEnded) {
      endedStudents[qrText] = true;
    }

    resumeScanning();
  }

  function resumeScanning() {
    setTimeout(() => {
      lastQRData = null;
      qrCooldown = false;
      scanning = true;
    }, 300);
  }

  // ================================================
  // 데이터 업로드
  // ================================================
  async function uploadData() {
    const allStats = getAllLocalStats();
    
    if (allStats.length === 0) {
      alert('업로드할 데이터 없음');
      return;
    }
    
    if (!confirm(`${allStats.length}개 데이터를 업로드하시겠습니까?`)) {
      return;
    }

    let success = 0;
    let fail = 0;

    for (let stat of allStats) {
      try {
        const url = 'https://script.google.com/macros/s/AKfycbxC92EzuvA5WamPJ1yNwgFleCLgjSgoKdpUm3e-rkBjFawWqseG9hXZ0I7ePQwOa1sP/exec?qr=' + encodeURIComponent(stat.qrText) + '&sessionId=' + encodeURIComponent(stat.sessionId);
        
        const result = await fetchWithRetry(url, 2);
        
        if (result.success) {
          success++;
        } else {
          fail++;
        }
      } catch (error) {
        fail++;
      }
    }

    if (success > 0) {
      // 성공한 것들 삭제
      for (let i = 0; i < success && i < allStats.length; i++) {
        const key = `localStats_${allStats[i].qrText}`;
        localStorage.removeItem(key);
      }
      updateOfflineCount();
      alert(`✅ ${success}개 업로드 완료`);
    } else {
      alert('❌ 업로드 실패');
    }
  }

  function clearData() {
    if (confirm('정말로 로컬 데이터를 모두 삭제하시겠습니까?')) {
      const allStats = getAllLocalStats();
      for (let stat of allStats) {
        const key = `localStats_${stat.qrText}`;
        localStorage.removeItem(key);
      }
      updateOfflineCount();
      alert('✅ 삭제됨');
    }
  }

  // ================================================
  // 일괄 종료
  // ================================================
  function batchEndSession() {
    const allStats = getAllLocalStats();
    
    if (allStats.length === 0) {
      alert('스캔된 학생이 없습니다');
      return;
    }

    if (confirm(`${allStats.length}명 학생을 종료하시겠습니까?\n(현재 시간으로 기록됩니다)`)) {
      const now = new Date();

      // 모든 학생의 lastScanTime을 현재 시간으로 업데이트
      for (let stat of allStats) {
        const first = new Date(stat.firstScanTime);
        const diffSec = Math.round((now - first) / 1000);
        const mins = Math.floor(diffSec / 60);
        const secs = diffSec % 60;
        const totalTime = mins + ':' + String(secs).padStart(2, '0');

        saveLocalStats(
          stat.qrText,
          stat.scanCount,
          stat.distance,
          totalTime,
          stat.studentName,
          stat.firstScanTime,
          now.toLocaleString('ko-KR')
        );
      }

      stopCamera();
      alert('✅ 모든 학생 종료됨');
      
      setTimeout(() => {
        localStorage.clear();
        location.reload();
      }, 2000);
    }
  }

  // ================================================
  // 시작
  // ================================================
  init();
  
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(err => {
      console.log('Wake Lock 실패:', err);
    });
  }
</script>
