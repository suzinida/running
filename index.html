<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>러닝 기록 프로그램</title>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      background: #f5f5f5; 
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .container { 
      max-width: 100%;
      max-height: 100vh;
      margin: 0 auto; 
      background: white; 
      padding: 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    h1 { 
      color: #4285F4; 
      text-align: center; 
      margin-bottom: 12px; 
      font-size: 24px;
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .session-info {
      background: #f0f7ff;
      border: 2px solid #4285F4;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #4285F4;
    }
    .session-info strong {
      font-size: 12px;
    }
    .mode-badge {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #2e7d32;
      font-weight: bold;
    }
    .mode-badge.max-distance {
      background: #fff3e0;
      border-color: #ff9800;
      color: #e65100;
    }
    .network-status {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 5px;
      display: inline-block;
    }
    .network-status.online {
      background: #d4edda;
      color: #155724;
    }
    .network-status.offline {
      background: #f8d7da;
      color: #721c24;
    }
    button.new-session-header {
      background: #ff9800;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 11px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }
    button.new-session-header:hover {
      background: #e68900;
    }
    .camera-section {
      position: relative;
      margin-bottom: 15px;
      background: #000;
      border: 2px solid #4285F4;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      width: 100%;
    }
    #video { 
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
      object-fit: cover;
      -webkit-transform: translate3d(0, 0, 0);
    }
    #canvas { display: none; }
    .camera-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    select {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      background: white;
      color: #333;
    }
    button { 
      background: #4285F4; 
      color: white;
      border: none; 
      padding: 8px 16px; 
      font-size: 13px; 
      border-radius: 5px; 
      cursor: pointer; 
      transition: background 0.3s;
      flex: 1;
      -webkit-user-select: none;
      user-select: none;
    }
    button:hover { background: #357ae8; }
    button:active { background: #2e5cc8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .stats {
      background: linear-gradient(135deg, #f0f7ff 0%, #e3f2fd 100%);
      border: 3px solid #4285F4;
      padding: 20px;
      border-radius: 12px;
      margin: 12px 0;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .stats.running-start {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border-color: #28a745;
    }
    .stats.running-end {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
      border-color: #ffc107;
    }
    .stats.duplicate {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      border-color: #f44336;
    }
    .stats-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .stats-title {
      font-size: 20px;
      font-weight: bold;
      color: #4285F4;
      margin-bottom: 12px;
    }
    .stats-title.running-start {
      color: #28a745;
    }
    .stats-title.running-end {
      color: #ff9800;
    }
    .stats-title.duplicate {
      color: #f44336;
    }
    .stats-info {
      font-size: 14px;
      color: #333;
      line-height: 1.8;
    }
    .stats-info strong {
      color: #34A853;
      font-size: 16px;
    }
    .section {
      background: #f9f9f9;
      border: 0.5px solid #e0e0e0;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .section h3 {
      color: #4285F4;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .offline-data-count {
      background: #fff3e0;
      border: 1px solid #ff9800;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #e65100;
    }
    .offline-data-count strong {
      font-size: 16px;
      color: #ff9800;
    }
    button.upload {
      background: #4caf50;
      width: 100%;
      margin-bottom: 8px;
      font-weight: bold;
    }
    button.upload:hover {
      background: #388e3c;
    }
    button.delete {
      background: #f44336;
      width: 100%;
      font-weight: bold;
    }
    button.delete:hover {
      background: #da190b;
    }
    button.batch-end {
      background: #f44336;
      width: 100%;
      margin-top: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    button.batch-end:hover {
      background: #da190b;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease-out;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 3px solid #4285F4;
      padding-bottom: 12px;
    }
    .modal-header h2 {
      color: #4285F4;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .session-code-section {
      background: #f0f7ff;
      border: 2px solid #4285F4;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
    }
    .session-code-label {
      font-size: 12px;
      color: #4285F4;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .session-code-input {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .session-date {
      font-size: 16px;
      font-weight: bold;
      color: #4285F4;
      min-width: 80px;
    }
    .session-period {
      width: 50px;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #4285F4;
      border-radius: 5px;
      text-align: center;
      color: #4285F4;
    }
    .session-period:focus {
      outline: none;
      border-color: #2e5cc8;
      background: #f0f7ff;
    }
    .session-code-display {
      background: white;
      border: 2px dashed #4285F4;
      padding: 8px;
      border-radius: 5px;
      font-size: 14px;
      color: #4285F4;
      font-weight: bold;
    }
    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }
    .mode-btn {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      font-size: 12px;
    }
    .mode-btn:active {
      border-color: #4285F4;
      background: #f0f7ff;
    }
    .mode-btn.selected {
      border-color: #4285F4;
      background: #f0f7ff;
    }
    .mode-btn .emoji {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .input-group {
      margin: 12px 0;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #4285F4;
    }
    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 10px;
    }
    .modal-buttons button.cancel {
      background: #999;
    }
    .modal-buttons button.cancel:hover {
      background: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏃 러닝 기록 프로그램</h1>
  
  <div class="session-header">
    <div class="session-info">
      <strong>세션: <span id="sessionDisplay">준비중</span></strong>
    </div>
    <div class="mode-badge" id="modeBadge">준비중</div>
    <div class="network-status online" id="networkStatus">🟢 온라인</div>
    <button class="new-session-header" onclick="startNewSession()">🔄 새 시작</button>
  </div>
  
  <div class="camera-section">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  
  <div class="camera-controls">
    <select id="cameraSelect">
      <option value="environment">후면 카메라</option>
      <option value="user">전면 카메라</option>
    </select>
  </div>
  
  <div class="button-group">
    <button id="startBtn" onclick="startCamera()">시작</button>
    <button id="stopBtn" onclick="stopCamera()" disabled>중지</button>
  </div>

  <div id="stats" class="stats" style="display:none;">
    <div class="stats-icon" id="statsIcon">📍</div>
    <div class="stats-title" id="statsTitle">기다중...</div>
    <div class="stats-info" id="statsInfo"></div>
  </div>
  

</div>

<div id="modeModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>수업 시작</h2>
      <p style="font-size: 12px;">세션 코드와 운동 모드를 설정하세요</p>
    </div>
    
    <div class="session-code-section">
      <div class="session-code-label">세션 설정</div>
      <div class="session-code-input">
        <div class="session-date" id="sessionDateDisplay">09월 09일</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="number" id="periodInput" class="session-period" placeholder="1" min="1" max="8" inputmode="numeric" onInput="updateConfirmButtonState()">
          <div style="font-size: 14px; color: #4285F4; font-weight: bold; min-width: 40px;">교시</div>
        </div>
      </div>
      <div class="session-code-display">
        세션명: <span id="sessionCodeDisplay">0909?</span>
      </div>
    </div>
    
    <div class="mode-buttons">
      <div class="mode-btn" id="maxDistanceBtn" onclick="selectMode('maxDistance')">
        <div class="emoji">📏</div>
        <strong>최대거리</strong>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">목표 거리<br>자동 종료</p>
      </div>
      <div class="mode-btn" id="freeBtn" onclick="selectMode('free')">
        <div class="emoji">🆓</div>
        <strong>자율</strong>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">거리 제한<br>없음</p>
      </div>
    </div>
    
    <div id="distanceInputGroup" class="input-group" style="display:none;">
      <label for="maxDistanceInput">목표 거리 (km):</label>
      <input type="number" id="maxDistanceInput" placeholder="예: 10" min="1" step="0.5" onInput="updateConfirmButtonState()">
    </div>
    
    <div class="modal-buttons">
      <button onclick="cancelModeSelect()" class="cancel">취소</button>
      <button id="confirmModeBtn" onclick="confirmMode()" disabled>확인</button>
    </div>
  </div>
</div>

<script>
  let video = document.getElementById('video');
  let canvas = document.getElementById('canvas');
  let canvasContext = canvas.getContext('2d');
  let scanning = false;
  let cameraStarted = false;
  let frameCount = 0;
  let lastQRData = null;
  let qrCooldown = false;
  let scanLoopInterval = null;
  
  let currentSessionId = null;
  let sessionMode = null;
  let maxDistance = null;
  let endedStudents = {};
  
  let isOnline = navigator.onLine;
  let selectedMode = null;

  window.addEventListener('online', () => {
    isOnline = true;
    updateNetworkStatus();
  });

  window.addEventListener('offline', () => {
    isOnline = false;
    updateNetworkStatus();
  });

  function updateNetworkStatus() {
    const status = document.getElementById('networkStatus');
    if (isOnline) {
      status.className = 'network-status online';
      status.textContent = '🟢 온라인';
    } else {
      status.className = 'network-status offline';
      status.textContent = '⚠️ 오프라인';
    }
  }

  async function fetchWithRetry(url, retries = 3) {
    for (let i = 0; i < retries; i++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        
        const response = await fetch(url, {
          method: 'GET',
          signal: controller.signal,
          headers: {
            'Accept': 'application/json'
          }
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        return data;
        
      } catch (error) {
        if (i === retries - 1) {
          throw error;
        }
        await new Promise(resolve => setTimeout(resolve, (i + 1) * 1000));
      }
    }
  }

  function calculatePace(totalSeconds, distance) {
    if (distance === 0) return null;
    
    const paceMinutes = (totalSeconds / distance) / 60;
    const paceMin = Math.floor(paceMinutes);
    const paceSec = Math.round((paceMinutes - paceMin) * 60);
    
    return `${paceMin}'${String(paceSec).padStart(2, '0')}"/km`;
  }

  function timeStringToSeconds(timeStr) {
    const parts = timeStr.split(':');
    const mins = parseInt(parts[0]) || 0;
    const secs = parseInt(parts[1]) || 0;
    return mins * 60 + secs;
  }





  // ================================================
  // 통계 표시 (메인)
  // ================================================
  function displayStats(studentData, scanCount, distance, totalTime, isEnded = false) {
    const statsDiv = document.getElementById('stats');
    const icon = document.getElementById('statsIcon');
    const title = document.getElementById('statsTitle');
    const info = document.getElementById('statsInfo');

    statsDiv.style.display = 'flex';
    statsDiv.classList.remove('running-start', 'running-end', 'duplicate');

    // 정확히 첫 번째 스캔일 때만 "러닝 시작" 표시
    if (scanCount === 1 && distance === 0) {
      icon.textContent = '🏃';
      title.textContent = '러닝 시작!';
      title.classList.add('running-start');
      statsDiv.classList.add('running-start');
      info.innerHTML = '';
    } else if (isEnded) {
      // 거리제한 도달 (마지막)
      icon.textContent = '🏁';
      title.textContent = '러닝 종료!';
      title.classList.add('running-end');
      statsDiv.classList.add('running-end');
      
      const totalSeconds = timeStringToSeconds(totalTime);
      const pace = calculatePace(totalSeconds, distance);
      
      info.innerHTML = `
        <div style="font-size: 13px;">
          <div style="margin-bottom: 8px;"><strong>${studentData.name}</strong></div>
          <div>⏱️ ${totalTime}</div>
          <div>거리: ${distance.toFixed(1)}km</div>
          ${pace ? `<div>페이스: ${pace}</div>` : ''}
        </div>
      `;
    } else {
      // 두 번째 이상 - 자율 모드든 거리제한 모드든 항상 표시
      icon.textContent = '📍';
      title.textContent = `${studentData.classNum}반 ${studentData.studentNum}번 학생`;
      title.classList.remove('running-start', 'running-end');
      statsDiv.classList.remove('running-start', 'running-end');
      
      const totalSeconds = timeStringToSeconds(totalTime);
      const pace = calculatePace(totalSeconds, distance);
      
      info.innerHTML = `
        <div>
          <div>⏱️ ${totalTime}</div>
          <div>거리: <strong>${distance.toFixed(1)}km</strong></div>
          <div>라운드: <strong>${scanCount - 1}</strong></div>
          ${pace ? `<div>페이스: ${pace}</div>` : ''}
        </div>
      `;
    }
  }



  function init() {
    updateNetworkStatus();
    initSessionCodeDisplay();
    
    currentSessionId = localStorage.getItem('currentSessionId');
    sessionMode = localStorage.getItem('sessionMode');
    maxDistance = localStorage.getItem('maxDistance');
    
    if (!currentSessionId || !sessionMode) {
      showModeModal();
    } else {
      displaySessionInfo();
      updateModeBadge();
    }
  }

  function initSessionCodeDisplay() {
    const today = new Date();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const date = String(today.getDate()).padStart(2, '0');
    const dateCode = month + date;
    const dateDisplay = `${month}월 ${date}일`;
    
    document.getElementById('sessionDateDisplay').textContent = dateDisplay;
    document.getElementById('sessionCodeDisplay').textContent = dateCode + '?';
    
    document.getElementById('periodInput').addEventListener('input', (e) => {
      const period = e.target.value;
      if (period) {
        document.getElementById('sessionCodeDisplay').textContent = dateCode + period;
      } else {
        document.getElementById('sessionCodeDisplay').textContent = dateCode + '?';
      }
      updateConfirmButtonState();
    });
  }

  function showModeModal() {
    document.getElementById('periodInput').value = '';
    document.getElementById('maxDistanceInput').value = '';
    
    const today = new Date();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const date = String(today.getDate()).padStart(2, '0');
    const dateCode = month + date;
    
    document.getElementById('sessionCodeDisplay').textContent = dateCode + '?';
    document.getElementById('modeModal').classList.add('show');
    document.getElementById('maxDistanceBtn').classList.remove('selected');
    document.getElementById('freeBtn').classList.remove('selected');
    document.getElementById('confirmModeBtn').disabled = true;
    selectedMode = null;
  }

  function selectMode(mode) {
    selectedMode = mode;
    
    document.getElementById('maxDistanceBtn').classList.remove('selected');
    document.getElementById('freeBtn').classList.remove('selected');
    
    if (mode === 'maxDistance') {
      document.getElementById('maxDistanceBtn').classList.add('selected');
      document.getElementById('distanceInputGroup').style.display = 'block';
    } else {
      document.getElementById('freeBtn').classList.add('selected');
      document.getElementById('distanceInputGroup').style.display = 'none';
    }
    
    updateConfirmButtonState();
  }

  function updateConfirmButtonState() {
    const period = document.getElementById('periodInput').value;
    const hasMode = selectedMode !== null;
    let hasDistance = true;
    
    if (selectedMode === 'maxDistance') {
      const distanceValue = parseFloat(document.getElementById('maxDistanceInput').value);
      hasDistance = !isNaN(distanceValue) && distanceValue > 0;
    }
    
    const canConfirm = hasMode && period && hasDistance;
    document.getElementById('confirmModeBtn').disabled = !canConfirm;
  }

  function confirmMode() {
    const period = document.getElementById('periodInput').value;
    
    if (!period || period < 1 || period > 8) {
      alert('교시를 올바르게 입력하세요 (1~8)');
      return;
    }
    
    if (!selectedMode) {
      alert('모드를 선택하세요');
      return;
    }
    
    if (selectedMode === 'maxDistance') {
      const distance = parseFloat(document.getElementById('maxDistanceInput').value);
      if (!distance || distance <= 0) {
        alert('거리를 입력하세요');
        return;
      }
      maxDistance = distance;
      localStorage.setItem('maxDistance', maxDistance);
    }
    
    const today = new Date();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const date = String(today.getDate()).padStart(2, '0');
    const sessionCode = month + date + period;
    
    currentSessionId = sessionCode;
    localStorage.setItem('currentSessionId', currentSessionId);
    
    sessionMode = selectedMode;
    localStorage.setItem('sessionMode', sessionMode);
    
    endedStudents = {};
    
    document.getElementById('modeModal').classList.remove('show');
    displaySessionInfo();
    updateModeBadge();
  }

  function cancelModeSelect() {
    if (confirm('취소하시겠습니까?')) {
      document.getElementById('modeModal').classList.remove('show');
    }
  }

  function displaySessionInfo() {
    document.getElementById('sessionDisplay').textContent = currentSessionId;
  }

  function updateModeBadge() {
    const badge = document.getElementById('modeBadge');
    if (sessionMode === 'maxDistance') {
      badge.className = 'mode-badge max-distance';
      badge.textContent = `📏 ${maxDistance}km`;
    } else {
      badge.className = 'mode-badge';
      badge.textContent = '🆓 자율';
    }
  }

  function startNewSession() {
    if (cameraStarted) {
      alert('카메라 중지 후 진행');
      return;
    }
    
    if (confirm('새로 시작?')) {
      localStorage.clear();
      location.reload();
    }
  }

  async function startCamera() {
    if (cameraStarted || !sessionMode) return;
    
    cameraStarted = true;
    
    try {
      const facingMode = document.getElementById('cameraSelect').value;
      const constraints = {
        video: { 
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };
      
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.style.display = 'block';
      
      await video.play();
      
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('cameraSelect').disabled = true;
      scanning = true;
      
      startScanLoop();
      
    } catch (error) {
      alert('카메라 오류');
      cameraStarted = false;
      document.getElementById('startBtn').disabled = false;
    }
  }

  function stopCamera() {
    const stream = video.srcObject;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    video.style.display = 'none';
    scanning = false;
    cameraStarted = false;
    
    if (scanLoopInterval) {
      clearInterval(scanLoopInterval);
      scanLoopInterval = null;
    }
    
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('cameraSelect').disabled = false;
  }

  function startScanLoop() {
    if (scanLoopInterval) clearInterval(scanLoopInterval);
    
    scanLoopInterval = setInterval(() => {
      if (!scanning) return;
      
      try {
        frameCount++;
        
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          
          if (canvas.width === 0 || canvas.height === 0) return;
          
          canvasContext.drawImage(video, 0, 0);
          const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
          
          if (typeof jsQR === 'function') {
            const code = jsQR(imageData.data, canvas.width, canvas.height);
            
            if (code && !qrCooldown) {
              if (lastQRData === code.data) {
                return;
              }
              
              lastQRData = code.data;
              qrCooldown = true;
              
              handleQRData(code.data);
            }
          }
        }
      } catch (e) {
        console.error('스캔 오류:', e);
      }
    }, 50);
  }

  async function handleQRData(qrText) {
    scanning = false;
    
    if (endedStudents[qrText]) {
      alert('이미 종료된 학생입니다');
      resumeScanning();
      return;
    }

    // 처리 중 표시
    const statsDiv = document.getElementById('stats');
    const icon = document.getElementById('statsIcon');
    const title = document.getElementById('statsTitle');
    const info = document.getElementById('statsInfo');
    
    statsDiv.style.display = 'flex';
    statsDiv.classList.remove('running-start', 'running-end', 'duplicate');
    icon.textContent = '⏳';
    title.textContent = '처리 중...';
    info.innerHTML = '';

    // 먼저 로컬 데이터 확인 (온/오프라인 모두 사용)
    const localData = getLocalStats(qrText);
    const parts = qrText.split('-');
    
    if (!parts || parts.length !== 2) {
      alert('QR 형식 오류');
      resumeScanning();
      return;
    }

    const classNum = parts[0];
    const studentNum = parts[1];

    // 온라인 필수 (핫스팟 필수)
    if (!isOnline) {
      alert('⚠️ 온라인 연결 필수입니다\n(핫스팟 켜세요)');
      resumeScanning();
      return;
    }

    try {
      const appScriptUrl = 'https://script.google.com/macros/s/AKfycbxC92EzuvA5WamPJ1yNwgFleCLgjSgoKdpUm3e-rkBjFawWqseG9hXZ0I7ePQwOa1sP/exec?qr=' + encodeURIComponent(qrText) + '&sessionId=' + encodeURIComponent(currentSessionId);
      
      const result = await fetchWithRetry(appScriptUrl, 3);
      
      if (result.success) {
        const scanCount = result.data.accumulated.scanCount;
        const distance = result.data.accumulated.distance || 0;
        const totalTime = result.data.accumulated.timeFormatted || "00:00:00";
        const studentData = result.data.student;
        
        const isEnded = sessionMode === 'maxDistance' && distance >= maxDistance;
        displayStats(studentData, scanCount, distance, totalTime, isEnded);
        
        if (isEnded) {
          endedStudents[qrText] = true;
        }
        
        resumeScanning();
        return;
      } else {
        throw new Error(result.message);
      }
    } catch (error) {
      alert('❌ 기록 저장 실패\n' + error.message);
      resumeScanning();
      return;
    }
  }

  function resumeScanning() {
    setTimeout(() => {
      lastQRData = null;
      qrCooldown = false;
      scanning = true;
    }, 300);
  }



  init();
  
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(err => {
      console.log('Wake Lock 실패:', err);
    });
  }
</script>
